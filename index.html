<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses 2027</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1A365D">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;height:100%;background:#1A365D}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#1A365D}
.msg{font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;text-align:center;padding:40px 20px}
.msg img{width:120px;border-radius:24px}
#splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1A365D;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;transition:opacity .45s ease}
#splash.off{opacity:0;pointer-events:none}
#splash .dt{font-size:15px;letter-spacing:.04em;opacity:.75}
#splash .bv{font-size:30px;font-weight:700;margin-bottom:10px}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:pl 1.8s ease-in-out infinite}
#splash .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:18px}
#splash .bar i{display:block;width:40%;height:100%;background:#DB217C;border-radius:4px;animation:ld 1.2s ease-in-out infinite}
#splash .qt{max-width:300px;margin-top:22px;padding:0 20px;min-height:62px;transition:opacity .4s ease}
#splash .qt.h{opacity:0}
#splash .qt b{display:block;font-size:17px;font-style:italic;font-weight:600;line-height:1.35}
#splash .qt span{display:block;font-size:12px;opacity:.6;margin-top:6px;letter-spacing:.03em}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div id="splash"><div class="dt" id="dt"></div><div class="bv">Bienvenue</div><img src="icon-512.png" alt="Van Rysel Roubaix"><div class="bar"><i></i></div><div class="qt" id="qt"></div></div>
<script>
try { document.getElementById("dt").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).replace(/^./, function (c) { return c.toUpperCase(); }); } catch (e) {}
try { var QT = [["Caresser les pédales", 1], ["Faire le métier", 1], ["Faire le portier", 1], ["Sortir en chasse-patate", 1], ["Se refaire la cerise", 1], ["Avoir un bon de sortie", 1], ["Ne pas passer un pont de chemin de fer", 1], ["Avoir la socquette légère", 1], ["Pédaler avec les oreilles", 1], ["Avoir les jambes lourdes", 1], ["Prendre un éclat", 1], ["Tricoter", 1], ["Faire l’accordéon", 1], ["Monter dans l’autobus", 1], ["Bâcher", 1], ["Avoir de la laine sous les ongles", 1], ["Déposer ses adversaires", 1], ["Faire le bourrin", 1], ["Fumer la pipe", 1], ["Faire rougir le onze dents", 1], ["Descendre comme un fer à repasser", 1], ["Être dans la mafia", 1], ["Sucer la roue", 1], ["Mettre la plaque", 1], ["Allez, allez, gamin !", 0], ["Il a mis une mine !", 0], ["Ça frotte dans le peloton !", 0], ["Il est dans le dur…", 0], ["Il a les jambes qui piquent.", 0], ["Il fait l’élastique…", 0], ["Ça va se jouer à la pédale !", 0], ["Il a pris un coup de bambou.", 0], ["Il a envoyé du lourd !", 0], ["Ça part de loin, très loin !", 0], ["Il met tout le monde dans le rouge.", 0], ["Le vent de face, ça use les bonhommes.", 0], ["Une course de bonhomme !", 0], ["Il est sur la jante.", 0], ["Il ne lâche rien, il s’arrache !", 0], ["Tout à bloc !", 0], ["Il a trouvé l’ouverture !", 0], ["Les pavés, ça ne pardonne pas.", 0], ["Ça sent la poudre !", 0], ["Bordure ! Il faut être devant !", 0], ["Il a sauté dans la bonne roue.", 0], ["Il a coincé dans la bosse…", 0], ["Il roule à l’économie.", 0], ["Le moteur tourne rond aujourd’hui !", 0], ["Attention à la fringale !", 0], ["C’est l’heure de vérité !", 0]];
  for (var qa = QT.length - 1; qa > 0; qa--) { var qb = Math.floor(Math.random() * (qa + 1)), qc = QT[qa]; QT[qa] = QT[qb]; QT[qb] = qc; }
  var qi = 0, qe = document.getElementById("qt"), qs = function () { var q = QT[qi % QT.length]; qe.innerHTML = "<b>« " + q[0] + " »</b><span>" + (q[1] ? "📖 Le dico vélo de maître Cyril" : "🚴 Expression du peloton") + "</span>"; }; qs();
  setInterval(function () { qe.classList.add("h"); setTimeout(function () { qi++; qs(); qe.classList.remove("h"); }, 400); }, 4500); } catch (e) {}
var EXEC = "https://script.google.com/macros/s/AKfycbxP0YRI4owUyeYKMM5bCpvJO5xLARthFwtYw88OgzXyR-p05Rsg6lEUGZVY_IRm3KgAMg/exec";
var k = new URLSearchParams(location.search).get("k");
try { if (k) localStorage.setItem("k", k); else k = localStorage.getItem("k"); } catch (e) {}
if (k) {
  var f = document.createElement("iframe");
  f.src = EXEC + "?k=" + encodeURIComponent(k);
  f.allow = "clipboard-write";
  var t0 = Date.now(), fin = function () { var s = document.getElementById("splash"); if (s && !s.classList.contains("off")) setTimeout(function () { s.classList.add("off"); setTimeout(function () { s.remove(); }, 500); }, Math.max(0, 700 - (Date.now() - t0))); };
  window.addEventListener("message", function (e) { if (e.data === "vrr-ready") fin(); }); setTimeout(fin, 45000);
  document.body.appendChild(f);
} else {
  document.body.innerHTML = '<div class="msg"><img src="icon-512.png" alt=""><h2>Courses 2027</h2><p>Colle ton lien personnel (ou ta clé) :</p><input id="kk" style="width:100%;max-width:420px;padding:12px;border-radius:10px;border:0;font-size:16px" placeholder="https://...?k=..." autocomplete="off"><br><button id="ok" style="margin-top:12px;padding:12px 28px;border-radius:10px;border:0;background:#DB217C;color:#fff;font-size:16px;font-weight:600">Ouvrir</button><p style="opacity:.7;font-size:13px">Pas de lien ? Demande-le à Lio.</p></div>';
  document.getElementById("ok").onclick = function () {
    var v = document.getElementById("kk").value.trim(), m = v.match(/[?&]k=([A-Za-z0-9]+)/);
    v = m ? m[1] : v.replace(/[^A-Za-z0-9]/g, "");
    if (v) { try { localStorage.setItem("k", v); } catch (e) {} location.replace("./?k=" + v); }
  };
}
</script>
</body>
</html>
